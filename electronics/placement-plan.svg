<text x="774" y="139" font-size="12" fill="#e0def4" font-weight="bold">Hoehenregeln (aus Mechanik-Stack):</text>
<text x="774" y="157" font-size="12" fill="#e0def4">- oben unter Spule: max 1.05 mm (QFN48 0.9 knapp!)</text>
<text x="774" y="175" font-size="12" fill="#e0def4">- oben ausserhalb Spule: bis ~2.1 mm (Piezo, Taster, 0805)</text>
<text x="774" y="193" font-size="12" fill="#e0def4">- unten ueber Akku (y>=13.7): max 0.5 mm: WCSP, X2SON, 0402</text>
<text x="774" y="211" font-size="12" fill="#e0def4">- unten ueber Kanuelen-Turm: keine Bauteile</text>
<text x="774" y="229" font-size="12" fill="#e0def4">- ISP1807: Antennenkante +y, Keepout alle Lagen (Mass TBD, Datenblatt)</text>
<text x="774" y="247" font-size="12" fill="#e0def4">- Hall: DRV5032 (0.4 mm) unten nahe Spindelende, TMAG5273 oben</text>
<text x="774" y="265" font-size="12" fill="#e0def4">- Konflikt: Hall (Spindelende y=22.5) liegt am Antennen-Keepout -> TBD</text>
