# Bench controller (openpatch_bench/nrf52840): TEST ONLY, water only.
# The bench shell lives on SEGGER RTT channel 0 (JLinkRTTClient / `nrfutil rtt`). The RTT log
# backend would fight for the same channel, so logs go through the shell's own log backend.
CONFIG_OPENPATCH_BENCH_MODE=y
CONFIG_OPENPATCH_BATTERY_MONITOR=n
CONFIG_OPENPATCH_TMAG_OPTIONAL=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=96
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=y
CONFIG_KERNEL_SHELL=n
CONFIG_SHELL_HISTORY=n
CONFIG_DEVMEM_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
