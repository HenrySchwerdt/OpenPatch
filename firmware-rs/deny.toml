# cargo-deny policy for the OpenPatch Rust workspaces (firmware-rs host workspace, fuzz, security/verify, openpatch-bench,
# openpatch-bootloader, tools/sigtool). Run: `cargo deny --manifest-path <ws>/Cargo.toml check` (see security/supply-chain/).
# TEST PROJECT, not a medical device.
#
# Licence policy rationale (LICENSE.md): firmware-rs is PolyForm-Noncommercial-1.0.0 with a commercial "Fair-Price" licence
# offered by the maintainer. A strong-copyleft dependency (GPL/AGPL/LGPL/SSPL/EUPL) linked into the firmware would make the
# commercial licence impossible, so they are DENIED in firmware crates. Weak file-level copyleft (MPL-2.0) is allowed but
# listed explicitly so each use is reviewed. ios/ is GPL-3.0-or-later and is covered by Swift Package Manager, not here.

[graph]
all-features = false
# thumbv7em is the embedded target of openpatch-bench / openpatch-bootloader.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "thumbv7em-none-eabihf",
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# An unmaintained / unsound advisory in a dependency of safety-critical code needs a decision, not a silent pass.
unmaintained = "all"
unsound = "all"
ignore = [
  # heapless 0.8.0 (pinned by openpatch-core/-proto `^0.8.0`): nine advisories published 2026-11-18/19, patched in >= 0.9.4.
  # Triage (security/THREAT-MODEL.md section 9 FINDING-007): the code only uses heapless::Vec and heapless::Deque (push/pop). Review date
  # 2026-11-19; REMOVE these entries when the dependency is upgraded (proposal 08, task SC-3).
  { id = "RUSTSEC-2026-0574", reason = "FindMutView (BinaryHeap) not used" },
  { id = "RUSTSEC-2026-0575", reason = "Spsc not used" },
  { id = "RUSTSEC-2026-0576", reason = "IndexMap not used" },
  { id = "RUSTSEC-2026-0577", reason = "Deque::clear/IntoIter::drop only unsound when an element's Drop panics; Notification and Vec<u8> elements have no Drop" },
  { id = "RUSTSEC-2026-0578", reason = "SortedLinkedList not used" },
  { id = "RUSTSEC-2026-0579", reason = "Deque TryFrom not used" },
  { id = "RUSTSEC-2026-0580", reason = "treiber stack / pool not used" },
  { id = "RUSTSEC-2026-0581", reason = "Deque::make_contiguous not used" },
  { id = "RUSTSEC-2026-0582", reason = "IndexMap not used" },
  # openpatch-bench lockfile only (FINDING-008, FINDING-013). Review by 2026-12-19, then re-evaluate or fix upstream.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via trouble-host -> p256 (BLE LE Secure Connections ECDH, link layer). The application layer does not use P-256; exposure = timing/EM observer during link-layer pairing. Not fixed upstream (needs crypto-bigint >= 0.7.6, p256 semver break). OPEN in SCORECARD SC-4." },
  { id = "RUSTSEC-2026-0110", reason = "bare-metal 0.2.5 deprecated; build-time/transitive of cortex-m, no runtime behaviour change; replace when cortex-m drops it." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0", # file level copyleft only (e.g. webpki-roots / option-ext); review each use
]
# Workspace crates themselves are governed by LICENSE.md (PolyForm Noncommercial + commercial licence).
[licenses.private]
ignore = true
[[licenses.exceptions]]
allow = ["PolyForm-Noncommercial-1.0.0"]
name = "openpatch-core"
[[licenses.exceptions]]
allow = ["PolyForm-Noncommercial-1.0.0"]
name = "openpatch-proto"
[[licenses.exceptions]]
allow = ["PolyForm-Noncommercial-1.0.0"]
name = "openpatch-diag"
[[licenses.exceptions]]
allow = ["PolyForm-Noncommercial-1.0.0"]
name = "openpatch-sim"
[[licenses.exceptions]]
allow = ["PolyForm-Noncommercial-1.0.0"]
name = "openpatch-fuzz"
[[licenses.exceptions]]
allow = ["NCSA"]   # LLVM libFuzzer runtime, fuzzing harness only, never linked into firmware
name = "libfuzzer-sys"
# differential-tests has no licence field and publish is not false: run with `--exclude differential-tests` (or set publish = false).

[bans]
multiple-versions = "warn"
wildcards = "warn"   # workspace crates lack publish = false, so path deps count as wildcards; make it "deny" once they have it
allow-wildcard-paths = true   # path dependencies inside this repository
highlight = "all"
deny = [
  # Heap / std / OS-RNG creep into the no_std core and proto would break the safety argument. Host-only crates may use them
  # via dev-dependencies; embedded builds are checked with `--target thumbv7em-none-eabihf`.
  { name = "openssl", reason = "no C crypto in firmware or tools; RustCrypto only" },
  { name = "openssl-sys", reason = "no C crypto in firmware or tools; RustCrypto only" },
  { name = "native-tls", reason = "no TLS stack in this repository" },
  { name = "ring", reason = "keep one audited crypto family (RustCrypto) unless a proposal decides otherwise" },
  { name = "chrono", reason = "known soundness history (localtime); use embassy-time / core::time" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies are allowed; embassy and trouble are consumed as crates.io releases. Add a git source only with an exact
# `rev` and an entry here, reviewed in the pull request.
allow-git = []
