# OpenPatch firmware, Rust port. TEST PROJECT: not a medical device, never to be worn (see ../DISCLAIMER.md).
# Host workspace: everything here builds and tests on the development machine.
# The embedded app `openpatch-bench` is a SEPARATE workspace (own target, own lockfile) so that
# `cargo test --workspace` never tries to compile it for the host.
[workspace]
resolver = "2"
members = ["openpatch-proto", "openpatch-core", "differential-tests"]
exclude = ["openpatch-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
heapless = { version = "0.8.0", default-features = false }
proptest = "1.5.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
