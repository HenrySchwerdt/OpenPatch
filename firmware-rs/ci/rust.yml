# DRAFT, not active: copy to .github/workflows/ to enable. OpenPatch Rust firmware (TEST PROJECT, not a medical device).
name: firmware-rs
on:
  push:
    paths: ["firmware-rs/**", "firmware/core/**", "spec/diag-codes.csv", "tools/gen_diag.py", "docs/06-diagnostics.md", "ios/OpenPatchKit/OpenPatchCore/Sources/OpenPatchCore/DiagCatalogue.swift"]
  pull_request:
    paths: ["firmware-rs/**", "firmware/core/**", "spec/diag-codes.csv", "tools/gen_diag.py", "docs/06-diagnostics.md", "ios/OpenPatchKit/OpenPatchCore/Sources/OpenPatchCore/DiagCatalogue.swift"]
defaults:
  run:
    working-directory: firmware-rs
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: firmware-rs }
      - run: python3 ../tools/gen_diag.py --check   # catalogue drift: CSV vs doc tables vs generated Rust, Swift, trace report
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace            # unit + property + differential tests against the C core
      - run: cargo test -p openpatch-proto --all-features
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --summary-only
  embedded:
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: thumbv7em-none-eabihf }
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo install flip-link cargo-binutils --locked
      - run: rustup component add llvm-tools-preview
      - run: ./scripts/build.sh      # bootloader + app for bench-e73 and nrf52840-dk, explicit drive preset
