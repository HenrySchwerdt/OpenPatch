[package]
name = "openpatch-bench"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "OpenPatch bench controller firmware (Embassy, nRF52840). TEST PROJECT, never to be worn; bench tests with WATER ONLY."

# Separate workspace: never built by the host workspace in ../Cargo.toml.
[workspace]

[features]
# NO implicit drive default: the drive feature must be given explicitly (compile_error! otherwise).
default = ["board-bench-e73", "angle-tmag"]

# ---- board (exactly one) ----
board-bench-e73 = ["embassy-nrf/nfc-pins-as-gpio"]   # electronics/bench/pin-assignment.md (Ebyte E73-2G4M08S1CX); P0.09 / P0.10 are OC_OK / PGATE_MON: UICR.NFCPINS = GPIO (written by embassy_nrf::init)
board-cup-v4 = []   # cup pod v4 (45 parts): src/board/cup_v4.rs, pump application (hal/cup.rs, ui_cup.rs, sup_link.rs) and the bring-up binary src/bin/cup_bringup.rs
board-cart-v1 = ["board-cup-v4"]   # cart pump main board v1: the cup v4 application with src/board/cart_v1.rs (other HJ-840 pads, same nets)
board-nrf52840-dk = []      # Nordic nRF52840-DK, no motor driver / interlock (docs/boards.md)

# ---- MOT_DIR polarity (INTERLOCK.md R96 / R97): default R96 fitted, forward = DIR low ----
dir-forward-high = []             # R97 fitted instead of R96: forward = DIR high (DIR_FORWARD_HIGH = true)

# ---- drive calibration preset (exactly one, no default; stored on first boot, compared at every boot) ----
drive-nfp-608-26-45-cup-miter-1-1 = []   # PRIMARY (scripts/build.sh default), v0.1.0 cup pod: NFP-608-26.45 -> miter z16:z16 (1:1) -> M1.6 rod into a cup plunger, bore 20.5 x 5.5, 0.00703 U/step (id 0x26); NO check valve: suction draw refused, assisted pressure fill only
drive-nfp-608-26-45-g16-20 = []   # bench variant (previous primary): NFP-608-26.45 + GHW 16T -> 20T step-down pair, ratio 33.0625, 0.003949 U/step (id 0x25)
drive-nfp-608-26-45-g15-12 = []   # option, NOT the current CAD: NFP-608-26.45, gear pair 15T -> 12T, ratio 21.16 (id 0x24)
drive-nfp-608-26-45-g1-1 = []     # option, NOT the current CAD: NFP-608-26.45 coaxial (id 0x20)
drive-syringe-rig-1ml = []        # bench rig: NFP direct on a 1 ml U100 syringe plunger (id 0x30, area ASSUMED)
drive-zwbpd006006-6-43 = []
drive-zwbpd006006-4-8 = []
drive-faulhaber-adm0620-16 = []

# ---- dock input from software (bench rigs without the dock hall switch; also what draw tests need) ----
# DOCKED is reported from software (initial = docked, DK BUTTON2 toggles). Hardware interlock boards
# refuse it at compile time unless `unsafe-bench-override` is also given.
dock-simulated = []
# Allows dock-simulated on board-bench-e73. The hardware interlock still needs the real DOCKED
# gate for VMOT, so this only fools the firmware, never the supply gate. Bench only.
unsafe-bench-override = []

# ---- absolute leadscrew angle source (exactly one) ----
angle-tmag = []                   # TMAG5273 over I2C 0x35 (P0.26 / P0.06), the real channel
# Synthesizes angle counts from the two DRV5032 hall switches (quadrature, 1024 counts per edge, one
# pole pair placeholder). NOT sufficient for the 3 %/revolution check: expect deviation faults.
angle-qdec-fallback = []
# TMAG5273 angle plane (default Y-Z: the leadscrew magnet rotates in the pod Y-Z plane) and range (default +-80 mT).
tmag-plane-xy = []
tmag-plane-xz = []
tmag-range-40mt = []
# Optional coarse cross-check: keep the QDEC task running and log raw counts per burst.
coarse-qdec = []

# ---- bench / development ----
# DEVELOPMENT ONLY: accept plaintext frames and use the fixed dev session key. Never for anything
# but bench work (docs/bench-testing.md, docs/stubs.md).
dev-plaintext = []
# Start the bench sequence at boot with the compile-time defaults (env OPENPATCH_BENCH_*).
bench-autostart = []

[[bin]]
name = "openpatch-bench"
path = "src/main.rs"

[[bin]]
name = "cup_bringup"
path = "src/bin/cup_bringup.rs"
required-features = ["board-cup-v4"]

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "=0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "=0.11.0", features = ["defmt", "time-driver-rtc1", "gpiote", "unstable-pac", "rt", "nrf52840"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-futures = "=0.1.2"
embassy-embedded-hal = "=0.6.0"
# no verify feature: the BOOTLOADER verifies the format-2 manifest (openpatch-boot-policy); the app only arms the swap (mark_updated)
embassy-boot = { version = "=0.7.0", default-features = false }

nrf-sdc = { version = "=0.4.0", default-features = false, features = ["defmt", "peripheral", "nrf52840"] }
nrf-mpsl = { version = "=0.4.0", default-features = false, features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "=0.10.1", default-features = false, features = ["defmt"] }
trouble-host = { version = "=0.8.0", default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "default-packet-pool-mtu-251", "security", "defmt"] }

sequential-storage = "=8.0.2"
embedded-storage = "=0.3.2"
embedded-storage-async = "=0.4.2"

defmt = "=1.2.0"
defmt-rtt = "=1.3.1"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
cortex-m = { version = "=0.7.10", features = ["inline-asm"] }
cortex-m-rt = "=0.7.7"
static_cell = "=2.1.1"
critical-section = "=1.2.0"

openpatch-core = { path = "../openpatch-core", features = ["defmt"] }
openpatch-proto = { path = "../openpatch-proto", features = ["defmt", "aes-ccm", "key-agreement"] }
# Cup pod v4: the supervisor status frame (no defmt feature: the supervisor crate uses another defmt major version)
openpatch-supervisor = { path = "../openpatch-supervisor" }
# Pod side DRBG for the session key agreement (docs/04-protocol.md section 5.2): seeded once per boot from the nRF52840 TRNG.
rand_chacha = { version = "0.3.1", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
incremental = false

[profile.dev]
opt-level = "s"
debug = 2
panic = "abort"

# LE Secure Connections uses P-256 ECDH on the Cortex-M4. The faster assembly implementation
# (`trouble-host/security-p256-cortex-m4`) needs `arm-none-eabi-gcc` at build time; the pure Rust
# one is compiled for speed instead of size (pairing only happens inside the button window).
[profile.release.package.p256]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
