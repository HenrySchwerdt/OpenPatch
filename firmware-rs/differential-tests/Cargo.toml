[package]
name = "differential-tests"
description = "Host-only differential tests: Rust core vs the C reference core (unsafe FFI allowed here only)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
openpatch-core = { path = "../openpatch-core", features = ["test-calibrations"] }
openpatch-proto = { path = "../openpatch-proto" }

[build-dependencies]
cc = "1.1.0"

[dev-dependencies]
proptest = { workspace = true }
