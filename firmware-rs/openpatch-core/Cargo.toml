[package]
name = "openpatch-core"
description = "OpenPatch pump core: delivery engine, safety supervisor, two-pod logic, reservoir, event log. no_std, no alloc, no unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
defmt = ["dep:defmt", "openpatch-proto/defmt", "openpatch-diag/defmt"]
# HOST TESTS ONLY: adds the 26 100 / 8 156 uU/pulse test calibrations. Never enable in firmware.
test-calibrations = []

[dependencies]
openpatch-proto = { path = "../openpatch-proto" }
openpatch-diag = { path = "../openpatch-diag" }
heapless = { workspace = true }
defmt = { version = "0.3.8", optional = true }

[dev-dependencies]
openpatch-core = { path = ".", features = ["test-calibrations"] }
proptest = { workspace = true }
serde_json = "1.0"
