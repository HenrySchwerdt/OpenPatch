[package]
name = "sigtool"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "Host tool: ed25519 key generation and image signing for the OpenPatch bootloader (embassy-boot scheme: Ed25519 over the SHA-512 digest of the image)."

[workspace]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core"] }
sha2 = "=0.10.9"
getrandom = "=0.2.17"
openpatch-boot-policy = { path = "../../openpatch-boot-policy" }
