[package]
name = "openpatch-bootloader"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "OpenPatch nRF52840 bootloader (embassy-boot-nrf). TEST PROJECT, never to be worn."

[workspace]

[features]
# USB DFU transport glue (embassy-usb + DFU class). NOT built by default and not buildable/testable here: the host-tested rules it
# must call are `openpatch_boot_policy::dfu::DfuReceiver` and `verify_pending` (see docs/bootloader.md).
usb-dfu = []
# Exactly one board feature; only used to service the external TPL5010 watchdog during long
# flash operations (a swap takes several seconds, the TPL5010 interval is about 2 s).
default = ["board-bench-e73"]
board-bench-e73 = []
board-nrf52840-dk = []

[dependencies]
embassy-boot-nrf = { version = "=0.12.0", default-features = false }
embassy-boot = { version = "=0.7.0", default-features = false }
embassy-nrf = { version = "=0.11.0", default-features = false, features = ["nrf52840", "rt", "unstable-pac"] }
embassy-sync = "=0.8.0"
cortex-m = { version = "=0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
embedded-storage = "=0.3.2"
salty = { version = "=0.3.0", default-features = false }
openpatch-boot-policy = { path = "../openpatch-boot-policy" }
panic-reset = "=0.1.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
incremental = false
