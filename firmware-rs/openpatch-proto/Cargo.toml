[package]
name = "openpatch-proto"
description = "OpenPatch wire protocol v1: frame/TLV codec, CRC-16, session (replay + CCM trait). no_std, no alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Real AES-128-CCM (RFC 3610, M = 8, L = 2) via RustCrypto `aes` + `ccm`.
aes-ccm = ["dep:aes", "dep:ccm"]
# Application layer session key agreement (protocol v1.1 section 5.2, docs/04-protocol.md):
# ephemeral X25519 + HKDF-SHA256 bound to a long-term pairing secret. Pure Rust, no_std, no alloc.
key-agreement = ["aes-ccm", "dep:x25519-dalek", "dep:hkdf", "dep:sha2", "dep:hmac", "dep:subtle", "dep:rand_core"]
std = []
defmt = ["dep:defmt"]

[dependencies]
heapless = { workspace = true }
aes = { version = "0.8.4", optional = true, default-features = false }
ccm = { version = "0.5.0", optional = true, default-features = false }
defmt = { version = "0.3.8", optional = true }
x25519-dalek = { version = "2.0.1", optional = true, default-features = false }
hkdf = { version = "0.12.4", optional = true, default-features = false }
sha2 = { version = "0.10.8", optional = true, default-features = false }
hmac = { version = "0.12.1", optional = true, default-features = false }
subtle = { version = "2.6.1", optional = true, default-features = false }
rand_core = { version = "0.6.4", optional = true, default-features = false }

[dev-dependencies]
proptest = { workspace = true }
serde_json = "1.0"
