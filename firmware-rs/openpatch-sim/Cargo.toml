[package]
name = "openpatch-sim"
description = "OpenPatch virtual pod: deterministic physics-based plant models behind the core Hal trait, scenario runner (opsim) and Monte Carlo. Host only. TEST PROJECT, never to be worn."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "openpatch_sim"
path = "src/lib.rs"

[[bin]]
name = "opsim"
path = "src/bin/opsim.rs"

[dependencies]
openpatch-core = { path = "../openpatch-core" }
openpatch-proto = { path = "../openpatch-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
